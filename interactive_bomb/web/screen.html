<!doctype html>
<html lang="fr"><meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:#081810;color:#8dffc2;font-family:Arial,sans-serif}
#display{height:280px;padding:8px 24px;border:5px solid #1e6847}
main,footer{display:flex;align-items:center;justify-content:space-between}
#timer{font:700 116px monospace;line-height:140px;letter-spacing:-4px}#status{font-size:28px}
footer{font:40px monospace}#settings{font:26px monospace;margin-top:14px}
#plate{position:absolute;top:288px;width:1024px;height:736px;background:#e9e4ca;color:#18241e;padding:40px 48px;border:12px solid #343f36}
.kicker{font-size:36px;letter-spacing:7px;border-bottom:4px solid #3d4a40;padding-bottom:20px}
#serial{font:700 104px monospace;letter-spacing:4px;margin:32px 0 18px}
#kind{font-size:50px;font-weight:bold}
.specs{display:flex;gap:55px;margin-top:42px;font:700 62px monospace}
.bottom{margin-top:44px;font-size:32px;letter-spacing:2px}
</style>
<div id="display"><main><span id="timer">T--:--</span><span id="status">SYNC</span></main>
<footer><span id="code">_ _ _ _ _ _</span><span id="gauge">100%</span></footer>
<div id="settings">M1 ---° · M2 ---°</div></div>
<div id="plate"><div class="kicker">B-07 / IDENTIFICATION</div>
<div id="serial">-- ----</div><div id="kind">LECTURE EN COURS</div>
<div class="specs"><span id="cells">CELL --</span><span id="bus">BUS -</span></div>
<div class="bottom" id="revision">MANUEL RÉVISION 1</div></div>
<script>
(() => {
const ids=['timer','status','code','gauge','settings','serial','kind','cells','bus','revision'];
const el=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
const labels={armed:'ARMÉE',defused:'DÉSAMORCÉE',detonated:'DÉTONATION',sync:'SYNC'};
const kinds={explosive:'EXPLOSIVE / TYPE 1',bio:'BIO / TYPE 2',nuke:'NUKE / TYPE 3',emp:'EMP / TYPE 4'};
window.addEventListener('message',({data})=>{
 if(!data||typeof data!=='object')return;
 el.timer.textContent=String(data.timer||'T--:--');
 el.status.textContent=labels[data.status]||'SYNC';
 el.code.textContent=String(data.code||'_ _ _ _ _ _').slice(0,data.code?6:11);
 el.gauge.textContent=Math.round(Number(data.stability)||0)+'%';
 const angle=id=>String(Number(data.knobs?.[id])||0).padStart(3,'0')+'°';
 el.settings.textContent='M1 '+angle('1')+' · M2 '+angle('2');
 const q=data.clues;
 el.serial.textContent=q?.serial||'FIXE';
 el.kind.textContent=kinds[data.kind]||'B-07';
 el.cells.textContent='CELL '+(q?.cells??'--');el.bus.textContent='BUS '+(q?.bus||'-');
 el.revision.textContent=q?'MANUEL RÉVISION '+q.version:'MODE FIXE / CONFIGURATION SERVEUR';
 document.getElementById('display').style.color=data.status==='detonated'?'#ff765b':'#8dffc2';
});
const query=new URLSearchParams(location.search);
// Le nom de la fenêtre DUI peut être généré par FiveM. Ne jamais déduire
// l'endpoint de GetParentResourceName() dans ce navigateur hors écran.
const resource=query.get('resource');
async function ready(){
 if(!resource||!/^[a-zA-Z0-9_-]+$/.test(resource))return;
 try {
  const response=await fetch('https://'+resource+'/ibomb_screen_ready',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({slot:query.get('slot'),token:query.get('token')})
  });
  const result=await response.json();
  if(!result.ok)setTimeout(ready,1000);
 }catch(e){setTimeout(ready,1000);}
}
ready();
})();
</script></html>
